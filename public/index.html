<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlox - Buscar Películas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <h1 class="titulo">CinePlox</h1>
            <div class="busqueda">
                <input type="text" id="campoBusqueda" class="campo-busqueda" placeholder="Buscar películas...">
                <button id="botonBuscar" class="boton-buscar">Buscar</button>
            </div>
        </div>
    </header>

    <main class="principal">
        <div class="contenedor">
            <h2 id="tituloSeccion" class="titulo-seccion">Películas Populares</h2>
            <div id="mensajeEstado" class="mensaje-estado"></div>
            <div id="contenedorPeliculas" class="cuadricula-peliculas"></div>
        </div>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor">
            <p class="credito">Datos proporcionados por <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a></p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
